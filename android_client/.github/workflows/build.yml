name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android_client/**'
      - 'pc_client/client.py'
      - 'pc_client/database.py'
      - 'pc_client/encryption.py'
      - '.github/workflows/**'  # ✅ Добавлено: правки самого воркфлоу тоже запустят сборку
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade buildozer cython
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git python3-dev \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev \
          libgstreamer1.0 gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libtool m4 pkg-config automake autoconf  # ✅ КРИТИЧНО для libffi/cryptography
    
    - name: Prepare Android client
      run: |
        cd android_client
        # Создаём симлинки на общие модули
        ln -sf ../pc_client/client.py client.py
        ln -sf ../pc_client/database.py database.py
        ln -sf ../pc_client/encryption.py encryption.py
        #  Убрал cp buildozer.spec ../ (не нужно, buildozer ищет его в текущей папке)
    
    - name: Build APK
      run: |
        cd android_client
        buildozer android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: freedomlink-android-apk
        path: android_client/bin/*.apk