name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android_client/**'
      - 'pc_client/client.py'
      - 'pc_client/database.py'
      - 'pc_client/encryption.py'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Buildozer deps
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -f -y
        sudo apt-get install -y \
          python3-pip build-essential git python3-dev \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev \
          autoconf libtool pkg-config
    
    - name: Prepare Android client
      run: |
        cd android_client
        ln -sf ../pc_client/client.py client.py
        ln -sf ../pc_client/database.py database.py
        ln -sf ../pc_client/encryption.py encryption.py
    
    - name: Build APK
      run: |
        cd android_client
        
        # 🔥 Очистка кэша pyjnius/cython
        rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/pyjnius
        rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/hostpython3
        rm -rf .buildozer/android/packages/pyjnius*
        
        # ✅ Фиксим версию Cython
        pip install "cython<3.0"
        
        # ✅ КРИТИЧНО: OpenSSL требует эту переменную
        export ANDROID_NDK_HOME=$ANDROID_NDK

        # Сборка
        buildozer -v android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: freedomlink-android
        path: android_client/bin/*.apk