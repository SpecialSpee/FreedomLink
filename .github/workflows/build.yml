name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android_client/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    # ✅ ИСПОЛЬЗУЕМ ОФИЦИАЛЬНЫЙ ОБРАЗ С ПРЕ-УСТАНОВЛЕННЫМИ ЗАВИСИМОСТЯМИ
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK
      run: |
        cd android_client
        
        # Создаём симлинки на общие модули
        ln -sf ../pc_client/client.py client.py
        ln -sf ../pc_client/database.py database.py
        ln -sf ../pc_client/encryption.py encryption.py
        
        # 🔥 Очистка кэша перед сборкой
        rm -rf .buildozer
        
        # ✅ Авто-подтверждение запуска от root + сборка
        yes | buildozer -v android debug
        
      env:
        CI: true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: freedomlink-android-full
        path: android_client/bin/*.apk