name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android_client/**'
      - 'pc_client/client.py'
      - 'pc_client/database.py'
      - 'pc_client/encryption.py'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git python3-dev \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev \
          autoconf libtool pkg-config
    
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython<3.0
    
    - name: Prepare Android Client
      run: |
        cd android_client
        ln -sf ../pc_client/client.py client.py
        ln -sf ../pc_client/database.py database.py
        ln -sf ../pc_client/encryption.py encryption.py
    
    - name: Build APK
      # 🔥 ВАЖНО: Передаем ANDROID_NDK_HOME через env, а не через export в run
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
        CI: true
      run: |
        cd android_client
        
        # Очистка кэша перед сборкой
        rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/pyjnius
        rm -rf .buildozer/android/packages/pyjnius*
        
        # Запуск сборки
        buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: freedomlink-android
        path: android_client/bin/*.apk